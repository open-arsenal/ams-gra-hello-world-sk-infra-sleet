# Metrics and Observability Overlay
#
# Usage:
#   podman-compose -f compose.yaml -f compose.dev.yaml -f compose.metrics.yaml up
#
# Adds Prometheus to scrape Sleet and Grafana to visualize it.

services:
  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      # Mount provisioning configs
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro,Z
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro,Z
      # Mount the actual dashboards folder
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
    depends_on:
      - prometheus
