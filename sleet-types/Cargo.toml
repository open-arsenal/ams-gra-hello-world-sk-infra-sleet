[package]
name = "sleet-types"
version = "0.1.0"
edition = "2024"
description = "Shared LA-CAL/OWP protocol and UCI message types for Sleet"
license = "Apache-2.0"
repository = "https://gitlab.com/open-arsenal/ams-gra/hello-world-sk/infra/sleet"
keywords = ["oms", "uci", "cal", "owp"]
categories = ["network-programming"]
readme = "../README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }

[lints]
workspace = true
