[package]
name = "sleet"
version = "0.1.0"
edition = "2024"
description = "OMS LA-CAL server in Rust"
license = "Apache-2.0"
repository = "https://gitlab.com/open-arsenal/ams-gra/hello-world-sk/infra/sleet"
keywords = ["oms", "uci", "cal", "websocket"]
categories = ["network-programming"]
readme = "../README.md"

[features]
default = []
otlp = [
  "dep:opentelemetry",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry_sdk",
  "dep:tonic",
  "dep:tracing-opentelemetry",
]

[dependencies]
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
metrics-process = "2.4.3"
opentelemetry = { version = "0.31", optional = true }
opentelemetry-otlp = { version = "0.31", optional = true, features = [
  "grpc-tonic",
] }
opentelemetry_sdk = { version = "0.31", optional = true, features = [
  "rt-tokio",
] }
quick-xml = "0.37"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sleet-types = { path = "../sleet-types" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
tokio-util = "0.7"
toml = "0.8"
tonic = { version = "0.14", optional = true }
tracing = "0.1"
tracing-opentelemetry = { version = "0.32", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v5"] }

[dev-dependencies]
sleet-client = { path = "../sleet-client" }
tempfile = "3"

[lints]
workspace = true
