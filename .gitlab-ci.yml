# All versioned image references in one place — update here, not in jobs.
variables:
  CI_IMAGE_PREFIX: ""
  BUILD_IMAGE: "${CI_IMAGE_PREFIX}quay.io/almalinuxorg/almalinux:10.1-20260129"
  RUNTIME_IMAGE: "${CI_IMAGE_PREFIX}quay.io/almalinuxorg/10-micro:10.1-20260129"
  BUILDAH_IMAGE: "${CI_IMAGE_PREFIX}quay.io/buildah/stable:v1.43.0-immutable"
  RELEASE_CLI_IMAGE: "${CI_IMAGE_PREFIX}registry.gitlab.com/gitlab-org/release-cli:v0.24.0"
  LA_CAL_HARNESS_IMAGE: "${CI_REGISTRY}/open-arsenal/ams-gra/hello-world-sk/test/la-cal-harness:latest"
  SYFT_VERSION: v1.42.3
  SYFT_INSTALL_COMMIT: 860126c650c2d05b63b83a3895e41268162315a3

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml
  - template: Jobs/SAST-IaC.gitlab-ci.yml

container_scanning:
  stage: test
  needs:
    - job: build-runtime
      optional: true
  variables:
    CS_IMAGE: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/

secret_detection:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  needs: []

kics-iac-sast:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  needs: []

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^feat\//
    - if: $CI_COMMIT_BRANCH =~ /^fix\//

stages:
  - build-builder
  - validate
  - build
  - test
  - sbom
  - release

# ── Build Builder (first — all subsequent stages use this image) ──────────────

build-builder:
  stage: build-builder
  image: $BUILDAH_IMAGE
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  variables:
    BUILDER_IMAGE_SHA: "${CI_REGISTRY_IMAGE}/builder:${CI_COMMIT_SHORT_SHA}"
  before_script:
    - buildah --version
    - buildah login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
  script:
    - >-
      buildah bud --target builder
      --build-arg BUILD_IMAGE="${BUILD_IMAGE}"
      -t "${BUILDER_IMAGE_SHA}" -f Containerfile .
    - buildah push "${BUILDER_IMAGE_SHA}"
    - |
      EXTRA_TAG="${CI_REGISTRY_IMAGE}/builder:${CI_COMMIT_REF_SLUG}"
      buildah tag "${BUILDER_IMAGE_SHA}" "${EXTRA_TAG}"
      buildah push "${EXTRA_TAG}"
      echo "Pushed ${BUILDER_IMAGE_SHA} and ${EXTRA_TAG}"

# ── Validate (runs in the builder image) ─────────────────────────────────────

validate:
  stage: validate
  image: "${CI_REGISTRY_IMAGE}/builder:${CI_COMMIT_SHORT_SHA}"
  needs:
    - job: build-builder
      optional: true
  variables:
    SLEET_SCHEMA_PATH: /build/spec/002.5.0/UCI_MessageDefinitions_v2_5_0.xsd
  script:
    - make host-gate

audit:
  stage: validate
  image: "${CI_REGISTRY_IMAGE}/builder:${CI_COMMIT_SHORT_SHA}"
  needs:
    - job: build-builder
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  script:
    - make host-audit
    - make host-licenses
  artifacts:
    paths:
      - THIRD_PARTY_LICENSES.html
    expire_in: 90 days

# ── Build (runtime image, after validation passes) ────────────────────────────

build-runtime:
  stage: build
  image: $BUILDAH_IMAGE
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  variables:
    IMAGE_SHA: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
    BUILDER_PREFIX: "${CI_REGISTRY_IMAGE}/"
    BUILDER_TAG: ":${CI_COMMIT_SHORT_SHA}"
  before_script:
    - buildah --version
    - buildah login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
  script:
    - >-
      buildah bud
      --format docker
      --build-arg BUILD_IMAGE="${BUILD_IMAGE}"
      --build-arg RUNTIME_IMAGE="${RUNTIME_IMAGE}"
      --build-arg BUILDER_PREFIX="${BUILDER_PREFIX}"
      --build-arg BUILDER_TAG="${BUILDER_TAG}"
      -t "${IMAGE_SHA}" -f Containerfile .
    - buildah push "${IMAGE_SHA}"
    - |
      EXTRA_TAG="${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}"
      buildah tag "${IMAGE_SHA}" "${EXTRA_TAG}"
      buildah push "${EXTRA_TAG}"
      echo "Pushed ${IMAGE_SHA} and ${EXTRA_TAG}"

# ── Test ─────────────────────────────────────────────────────────────────────

test-harness:
  stage: test
  image:
    name: $LA_CAL_HARNESS_IMAGE
    entrypoint: [""]
  services:
    - name: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      alias: sleet
      entrypoint:
        - "/bin/sh"
        - "-c"
        - |
          timeout=30
          while [ ! -f "/builds/${CI_PROJECT_PATH}/config/harness-server.toml" ]; do
            sleep 1
            timeout=$((timeout - 1))
            if [ "$timeout" -le 0 ]; then
              echo "Timeout waiting for config/harness-server.toml" >&2
              exit 1
            fi
          done
          while read -r line || [ -n "$line" ]; do
            case "$line" in
              *schema_path*) echo 'schema_path = "/opt/sleet/spec/002.5.0/UCI_MessageDefinitions_v2_5_0.xsd"' ;;
              *) echo "$line" ;;
            esac
          done < "/builds/${CI_PROJECT_PATH}/config/harness-server.toml" > "/builds/${CI_PROJECT_PATH}/config/harness-server.tmp"
          mv "/builds/${CI_PROJECT_PATH}/config/harness-server.tmp" "/builds/${CI_PROJECT_PATH}/config/harness-server.toml"
          cd "/builds/${CI_PROJECT_PATH}"
          exec sleet config/harness-server.toml
  needs:
    - job: build-runtime
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  variables:
    LACAL_TARGET_URL: "ws://sleet:9000"
    LACAL_CONFIG: "config/harness.yaml"
  script:
    - mkdir -p reports
    - pytest /harness/tests/cert/ -c /harness/pyproject.toml -v --validation-tier exhaustive --junitxml=reports/junit.xml
  artifacts:
    when: always
    paths:
      - reports/
    reports:
      junit: reports/junit.xml

# ── Release (tag-triggered only) ─────────────────────────────────────────────

promote-images:
  stage: build
  image: $BUILDAH_IMAGE
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  before_script:
    - buildah --version
    - buildah login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
  script:
    - buildah pull "${CI_REGISTRY_IMAGE}/builder:${CI_COMMIT_SHORT_SHA}"
    - buildah pull "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
    - buildah tag "${CI_REGISTRY_IMAGE}/builder:${CI_COMMIT_SHORT_SHA}" "${CI_REGISTRY_IMAGE}/builder:${CI_COMMIT_TAG}"
    - buildah tag "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
    - buildah push "${CI_REGISTRY_IMAGE}/builder:${CI_COMMIT_TAG}"
    - buildah push "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
    - |
      IS_STABLE_TAG=false
      IS_PROTECTED_TAG=false
      ON_DEFAULT_BRANCH=false

      if echo "${CI_COMMIT_TAG}" | grep -Eq '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'; then
        IS_STABLE_TAG=true
      fi

      if [ "${CI_COMMIT_REF_PROTECTED:-false}" = "true" ]; then
        IS_PROTECTED_TAG=true
      fi

      git fetch origin "${CI_DEFAULT_BRANCH}" --depth=50
      if git merge-base --is-ancestor "${CI_COMMIT_SHA}" "origin/${CI_DEFAULT_BRANCH}"; then
        ON_DEFAULT_BRANCH=true
      fi

      if [ "${IS_STABLE_TAG}" = true ] && [ "${IS_PROTECTED_TAG}" = true ] && [ "${ON_DEFAULT_BRANCH}" = true ]; then
        buildah tag "${CI_REGISTRY_IMAGE}/builder:${CI_COMMIT_TAG}" "${CI_REGISTRY_IMAGE}/builder:latest"
        buildah tag "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}" "${CI_REGISTRY_IMAGE}:latest"
        buildah push "${CI_REGISTRY_IMAGE}/builder:latest"
        buildah push "${CI_REGISTRY_IMAGE}:latest"
        echo "Promoted stable protected default-branch tag ${CI_COMMIT_TAG} to latest"
      else
        echo "Not updating latest (stable=${IS_STABLE_TAG}, protected=${IS_PROTECTED_TAG}, on_default_branch=${ON_DEFAULT_BRANCH})"
      fi

# ── SBOM (scan built images, produce CycloneDX) ──────────────────────────────

sbom:
  stage: sbom
  image: $BUILDAH_IMAGE
  needs:
    - job: build-runtime
      optional: true
    - job: build-builder
      optional: true
    - job: promote-images
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  variables:
    SYFT_REGISTRY_AUTH_AUTHORITY: "${CI_REGISTRY}"
    SYFT_REGISTRY_AUTH_USERNAME: "${CI_REGISTRY_USER}"
    SYFT_REGISTRY_AUTH_PASSWORD: "${CI_REGISTRY_PASSWORD}"
  before_script:
    - curl -sSfL "https://raw.githubusercontent.com/anchore/syft/${SYFT_INSTALL_COMMIT}/install.sh" | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"
  script:
    - syft registry:"${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" -o cyclonedx-json > sbom-runtime.cdx.json
    - syft registry:"${CI_REGISTRY_IMAGE}/builder:${CI_COMMIT_SHORT_SHA}" -o cyclonedx-json > sbom-builder.cdx.json
  artifacts:
    paths:
      - sbom-runtime.cdx.json
      - sbom-builder.cdx.json
    expire_in: 90 days

# ── Release (tag-triggered only) ─────────────────────────────────────────────

bundle-runtime:
  stage: release
  image: $BUILDAH_IMAGE
  needs:
    - audit
    - sbom
    - promote-images
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  before_script:
    - dnf install -y jq
    - buildah login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
    - buildah pull "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
    - buildah pull "${CI_REGISTRY_IMAGE}/builder:${CI_COMMIT_TAG}"
  script:
    - scripts/bundle.sh runtime "$CI_COMMIT_TAG"
    - |
      f="sleet-${CI_COMMIT_TAG}.tar.gz"
      curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "$f" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sleet/${CI_COMMIT_TAG}/${f}"
      echo "Published ${f}"

bundle-devkit:
  stage: release
  image: $BUILDAH_IMAGE
  needs:
    - audit
    - sbom
    - promote-images
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  before_script:
    - dnf install -y jq
    - buildah login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
    - buildah pull "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
    - buildah pull "${CI_REGISTRY_IMAGE}/builder:${CI_COMMIT_TAG}"
  script:
    - scripts/bundle.sh devkit "$CI_COMMIT_TAG"
    - |
      f="sleet-${CI_COMMIT_TAG}-devkit.tar.gz"
      curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "$f" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sleet/${CI_COMMIT_TAG}/${f}"
      echo "Published ${f}"

release:
  stage: release
  image: $RELEASE_CLI_IMAGE
  needs: [bundle-runtime, bundle-devkit]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  environment:
    name: production
    action: start
  script:
    - echo "Creating release for ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: "sleet-${CI_COMMIT_TAG}.tar.gz"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sleet/${CI_COMMIT_TAG}/sleet-${CI_COMMIT_TAG}.tar.gz"
        - name: "sleet-${CI_COMMIT_TAG}-devkit.tar.gz"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sleet/${CI_COMMIT_TAG}/sleet-${CI_COMMIT_TAG}-devkit.tar.gz"
